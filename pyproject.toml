[project]
name = "handwritten-digit-classification"
version = "0.1.0"
description = "Handwritten Digit Classification using TensorFlow and Keras on MNIST dataset"
readme = "README.md"
authors = [
    { name = "Anuj04432", email = "anujwagmore835@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.16.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "pillow>=10.0.0"
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
